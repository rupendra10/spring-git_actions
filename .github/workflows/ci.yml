name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload packaged JAR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v7
        with:
          name: devopsapp-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

  container-image:
    name: Build and scan container image
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag devopsapp:${{ github.sha }} .

      # - name: Scan image
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: devopsapp:${{ github.sha }}
      #     format: table
      #     severity: CRITICAL,HIGH
      #     ignore-unfixed: true
      #     exit-code: '1'

      - name: Log in to Docker Hub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/spring-git_actions
        run: |
          docker tag devopsapp:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"
          docker tag devopsapp:${{ github.sha }} "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

